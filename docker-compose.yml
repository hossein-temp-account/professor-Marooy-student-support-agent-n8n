# =============================================================
# n8n + MySQL + admin panel, on a private bridge network. MySQL
# is not exposed to the host by default — only n8n and the admin
# service need it, both reached by the compose service name
# "mysql".
#
# Start:   docker compose up -d
# Logs:    docker compose logs -f admin
# Rebuild: docker compose up -d --force-recreate admin
#          (use this after editing anything under ./admin)
# Stop:    docker compose down        (keeps volumes)
# Nuke:    docker compose down -v     (DELETES DATA)
# =============================================================

services:

  mysql:
    image: mysql:8.4
    container_name: support_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-ft-min-token-size=3
      - --innodb-ft-enable-stopword=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Applied ONLY on first boot (empty data dir). Order matters.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - support_net
    # No `ports:` block. Uncomment only if you need a host client:
    # ports:
    #   - "127.0.0.1:3306:3306"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: support_n8n
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}

      # Losing this key makes every stored credential unreadable.
      # Back it up separately from the volumes.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_USER_MANAGEMENT_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # KB_MATCH_THRESHOLD is set directly inside the "Build Answer Context"
      # Code node (not via $env), because the block above hides $env.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      # Loopback only. Put a reverse proxy in front for public access.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/n8n:ro
      - ./evals:/evals:ro
    networks:
      - support_net

  admin:
    image: node:20-alpine
    container_name: support_admin
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    # Installs on every boot so it always matches package.json on
    # the bind mount below, then starts the server. node_modules
    # lives in its own named volume (admin_node_modules), not in
    # the bind mount, so a host/container OS mismatch (e.g. native
    # deps built on macOS/Windows) never leaks into the container.
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node server.js"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      # Loopback only, same posture as n8n above. Put a reverse
      # proxy in front (path /admin) for public access, or tunnel
      # it the same way you tunnel n8n.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./admin:/app
      # Keep node_modules inside its own volume, not overwritten by
      # the bind mount above (avoids host/container arch mismatches).
      # If the admin container ever misbehaves after you change
      # admin/package.json, wipe just this volume and recreate:
      #   docker compose down admin
      #   docker volume rm <project>_admin_node_modules
      #   docker compose up -d admin
      - admin_node_modules:/app/node_modules
    networks:
      - support_net

volumes:
  mysql_data:
  n8n_data:
  admin_node_modules:

networks:
  support_net:
    driver: bridge
